aid: convergence
name: convergence
description: Convergence AI was a London-based artificial-intelligence startup founded in 2024 by Marvin Purtorab
  (CEO) and Andy Toulis (CTO) building Proxy, a personal AI agent designed to complete open-ended administrative
  and web-browsing tasks across domains. Its approach centered on long-term memory and continual learning via a
  new class of models it called Large Meta Learning Models (LMLM). Convergence raised a $12M pre-seed led by Balderton
  Capital with participation from Salesforce Ventures and Shopify Ventures, and was acquired by Salesforce in May
  2025 to strengthen Agentforce. Its lasting public surface is the convergence-ai GitHub organization, which open-sourced
  proxy-lite (a mini open-weights web-browsing agent), the proxy-lite-3b vision-language model on Hugging Face,
  the LM2 memory-model paper repo, and the WebGames agent benchmark.
